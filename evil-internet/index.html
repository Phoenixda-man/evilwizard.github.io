<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="t-node">...</title>
    <link id="i-node" rel="icon" type="image/x-icon" href="data:image/x-icon;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.js" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <style>
        body { background-color: #000c40; margin: 0; padding: 20px; overflow: hidden; }
        #v-port { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; position: relative; }
        canvas { border: 2px solid #0050ef; background-color: #00082c; cursor: pointer; }
        #k-trap { position: absolute; top: -3000px; left: -3000px; }
        #t-render { position: absolute; top: 110px; left: calc(50% - 435px); width: 850px; height: 530px; overflow-y: auto; color: #efefef; font-family: sans-serif; font-size: 16px; line-height: 1.6; display: none; pointer-events: auto; }
        #t-render h1 { color: #66fcf1; font-size: 28px; margin-top: 0; }
        #t-render p { margin-bottom: 15px; }
        #t-render a { color: #ff0055; text-decoration: none; font-weight: bold; }
        #t-render a:hover { text-decoration: underline; }
        .py-loading, py-script, mpy-script { display: none !important; }
    </style>
</head>
<body>
    <div id="v-port">
        <canvas id="e-canvas" width="950" height="700"></canvas>
        <div id="t-render"></div>
    </div>
    <input type="text" id="k-trap" autocomplete="off">
    
    <script>const _un = (arr) => arr.map(c => String.fromCharCode(c)).join('');</script>
    <script src="assets.js"></script>
    <script src="render.js"></script>
    
    <script>
        const canvas = document.getElementById('e-canvas');
        const ctx = canvas.getContext('2d');
        const input = document.getElementById('k-trap');
        const tRender = document.getElementById('t-render');
        
        let state = {
            sMode: 0,
            queryStr: "",
            siteEntries: [],
            scrollOffset: 0,
            maxScroll: 0,
            tRender: tRender
        };
        
        let coordinatesMap = [];

        const fontLink = document.createElement('link');
        fontLink.rel = 'stylesheet';
        fontLink.href = _un(fontUrl);
        document.head.appendChild(fontLink);

        document.getElementById('t-node').innerText = _un(maskTitle);
        document.getElementById('i-node').href = _un(iconUrl);

        function triggerUIRender() {
            // Forward the graphics calculation request directly to render.js pipeline
            const renderEvent = new CustomEvent('requestFrameworkDraw', {
                detail: { ctx, canvas, state }
            });
            window.dispatchEvent(renderEvent);
        }

        // Receive layout metrics back from render.js
        window.addEventListener('frameworkDrawComplete', (e) => {
            coordinatesMap = e.detail.clickRegistry;
            state.maxScroll = e.detail.calculatedMaxScroll;
        });

        canvas.addEventListener('wheel', (e) => {
            if (state.sMode !== 1 || state.maxScroll <= 0) return;
            e.preventDefault();
            state.scrollOffset -= e.deltaY;
            if (state.scrollOffset > 0) state.scrollOffset = 0;
            if (state.scrollOffset < -state.maxScroll) state.scrollOffset = -state.maxScroll;
            triggerUIRender();
        }, { passive: false });

        window.addEventListener('pyIndexBroadcast', (e) => {
            const rawMatrix = JSON.parse(atob(e.detail));
            state.siteEntries = rawMatrix.strings.map((str, idx) => ({
                text: str,
                coord: rawMatrix.coords[idx],
                fl: rawMatrix.floats[idx],
                asset: rawMatrix.assets[idx]
            }));
            state.sMode = 1;
            state.scrollOffset = 0;
            triggerUIRender();
        });

        window.addEventListener('pyPageBroadcast', (e) => {
            tRender.innerHTML = e.detail;
            state.sMode = 2;
            state.scrollOffset = 0;
            triggerUIRender();
        });

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mX = e.clientX - rect.left;
            const mY = e.clientY - rect.top;

            if (state.sMode === 0) input.focus();

            coordinatesMap.forEach(zone => {
                if (mX >= zone.x && mX <= (zone.x + zone.w) && mY >= zone.y && mY <= (zone.y + zone.h)) {
                    if (zone.action === 1) {
                        if (input.value.trim() !== "") {
                            window.dispatchEvent(new CustomEvent('triggerSearch', { detail: input.value }));
                        }
                    } else if (zone.action === 2) {
                        state.sMode = 0;
                        state.queryStr = "";
                        input.value = "";
                        state.scrollOffset = 0;
                        tRender.innerHTML = "";
                        ctx.fillStyle = "#ffffff";
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        ctx.fillStyle = "#222222";
                        ctx.font = "bold 24px Arial";
                        ctx.fillText(_un(fakeTitle), 50, 100);
                    } else if (zone.action === 3) {
                        const target = state.siteEntries[zone.index].asset;
                        window.dispatchEvent(new CustomEvent('triggerPageLoad', { detail: target }));
                    }
                }
            });
        });

        input.addEventListener('input', (e) => {
            state.queryStr = e.target.value;
            triggerUIRender();
        });

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && state.queryStr.trim() !== "") {
                window.dispatchEvent(new CustomEvent('triggerSearch', { detail: state.queryStr }));
            }
        });

        document.fonts.load('1em "EB Garamond"').then(() => { triggerUIRender(); });
    </script>
    <script type="py" src="engine.py" async></script>
</body>
</html>
