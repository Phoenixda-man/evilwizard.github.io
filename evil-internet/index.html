<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0b0d12; color: #f1f5f9; display: flex; justify-content: center; padding: 2rem; margin: 0; }
    .card { background: #141821; padding: 2rem; border-radius: 14px; width: 100%; max-width: 840px; box-shadow: 0 12px 30px rgba(0,0,0,0.6); border: 1px solid #232936; }
      h2 { margin-top: 0; color: #e2e8f0; text-align: center; }
        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; max-width: 280px; margin: 1rem auto; }
          .calc-display { grid-column: span 4; background: #090b0f; color: #22c55e; font-family: monospace; font-size: 1.6rem; padding: 12px; text-align: right; border-radius: 8px; border: 1px solid #262d3d; }
            button { padding: 13px; font-size: 1rem; border: none; border-radius: 8px; background: #232a38; color: white; cursor: pointer; font-weight: 500; }
              button:hover { background: #313b4f; }
                button.op { background: #dc2626; }
                  button.op:hover { background: #b91c1c; }
                    button.eq { background: #16a34a; }
                      .hidden { display: none; }
                        .brand { text-align: center; font-size: 2.2rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 1.25rem; color: #ef4444; }
                          .brand span { color: #f8fafc; }
                            .search-bar { display: flex; gap: 8px; margin-bottom: 1rem; }
                              input[type="text"], input[type="password"], select { flex: 1; padding: 12px 16px; border-radius: 999px; border: 1px solid #2d3548; background: #090b0f; color: white; font-size: 0.95rem; outline: none; }
                                input:focus, select:focus { border-color: #ef4444; }
                                  .search-btn { border-radius: 999px; padding: 12px 22px; background: #dc2626; font-weight: 600; }
                                    .search-btn:hover { background: #b91c1c; }
                                      .secondary-btn { border-radius: 999px; padding: 10px 18px; background: #1e2433; font-size: 0.85rem; }
                                        .settings-toggle { text-align: center; margin-bottom: 1rem; }
                                          .settings-toggle summary { cursor: pointer; color: #94a3b8; font-size: 0.85rem; list-style: none; }
                                            .settings-toggle summary:hover { color: #e2e8f0; }
                                              .settings-box { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 0.75rem; }
                                                .settings-box input { border-radius: 8px; padding: 9px 12px; font-size: 0.85rem; }
                                                  .status-msg { text-align: center; font-size: 0.85rem; color: #94a3b8; margin-bottom: 0.75rem; min-height: 1.2rem; }
                                                    iframe { width: 100%; height: 500px; background: white; border-radius: 10px; border: 1px solid #2d3548; margin-top: 0.5rem; }
                                                    </style>
                                                    </head>
                                                    <body>
                                                    <div class="card">
                                                      <div id="calc-gate">
                                                          <h2>Calculator</h2>
                                                              <div class="calc-grid">
                                                                    <div class="calc-display" id="display">0</div>
                                                                          <button onclick="press('7')">7</button><button onclick="press('8')">8</button><button onclick="press('9')">9</button><button class="op" onclick="press('/')">/</button>
                                                                                <button onclick="press('4')">4</button><button onclick="press('5')">5</button><button onclick="press('6')">6</button><button class="op" onclick="press('*')">*</button>
                                                                                      <button onclick="press('1')">1</button><button onclick="press('2')">2</button><button onclick="press('3')">3</button><button class="op" onclick="press('-')">-</button>
                                                                                            <button onclick="clearDisp()">C</button><button onclick="press('0')">0</button><button class="eq" onclick="calculate()">=</button><button class="op" onclick="press('+')">+</button>
                                                                                                </div>
                                                                                                  </div>

                                                                                                    <div id="fetcher-panel" class="hidden">
                                                                                                        <div class="brand">Evil <span>Internet</span></div>

                                                                                                            <div class="search-bar">
                                                                                                                  <input type="text" id="target-url" placeholder="Search or enter a web address..." value="https://example.com" onkeydown="if(event.key==='Enter') go()" />
                                                                                                                        <button class="search-btn" onclick="go()">Go</button>
                                                                                                                            </div>

                                                                                                                                <div class="search-bar">
                                                                                                                                      <select id="stored-select" onchange="loadSelectedFile()">
                                                                                                                                              <option value="">Loading saved pages...</option>
                                                                                                                                                    </select>
                                                                                                                                                          <button class="secondary-btn" onclick="refreshManifest()">Refresh</button>
                                                                                                                                                              </div>

                                                                                                                                                                  <details class="settings-toggle">
                                                                                                                                                                        <summary>Connection Settings</summary>
                                                                                                                                                                              <div class="settings-box">
                                                                                                                                                                                      <input type="text" id="gh-owner" placeholder="Username" />
                                                                                                                                                                                              <input type="text" id="gh-repo" placeholder="Site Name" />
                                                                                                                                                                                                      <input type="password" id="gh-token" placeholder="Access Key" />
                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                </details>

                                                                                                                                                                                                                    <div id="action-status" class="status-msg"></div>

                                                                                                                                                                                                                        <iframe id="preview-frame" sandbox="allow-same-origin"></iframe>
                                                                                                                                                                                                                          </div>
                                                                                                                                                                                                                          </div>

                                                                                                                                                                                                                          <script>
                                                                                                                                                                                                                          let expr = "";
                                                                                                                                                                                                                          const display = document.getElementById("display");

                                                                                                                                                                                                                          function press(ch) {
                                                                                                                                                                                                                            expr += ch;
                                                                                                                                                                                                                              display.textContent = expr;
                                                                                                                                                                                                                                checkUnlock(expr);
                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                function clearDisp() {
                                                                                                                                                                                                                                  expr = "";
                                                                                                                                                                                                                                    display.textContent = "0";
                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                    function calculate() {
                                                                                                                                                                                                                                      try {
                                                                                                                                                                                                                                          const val = String(Function('"use strict";return (' + expr + ')')());
                                                                                                                                                                                                                                              expr = val;
                                                                                                                                                                                                                                                  display.textContent = val;
                                                                                                                                                                                                                                                      checkUnlock(val);
                                                                                                                                                                                                                                                        } catch {
                                                                                                                                                                                                                                                            display.textContent = "Error";
                                                                                                                                                                                                                                                                expr = "";
                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                  function checkUnlock(val) {
                                                                                                                                                                                                                                                                    if (val === "5125") {
                                                                                                                                                                                                                                                                        document.getElementById("calc-gate").classList.add("hidden");
                                                                                                                                                                                                                                                                            document.getElementById("fetcher-panel").classList.remove("hidden");
                                                                                                                                                                                                                                                                                autoDetectRepo();
                                                                                                                                                                                                                                                                                    refreshManifest();
                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                      function autoDetectRepo() {
                                                                                                                                                                                                                                                                                        const host = window.location.hostname;
                                                                                                                                                                                                                                                                                          const pathParts = window.location.pathname.split("/").filter(Boolean);
                                                                                                                                                                                                                                                                                            if (host.endsWith(".github.io")) {
                                                                                                                                                                                                                                                                                                document.getElementById("gh-owner").value = host.replace(".github.io", "");
                                                                                                                                                                                                                                                                                                    if (pathParts.length > 0) document.getElementById("gh-repo").value = pathParts[0];
                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                        const savedPat = localStorage.getItem("gh_fetcher_pat");
                                                                                                                                                                                                                                                                                                          if (savedPat) document.getElementById("gh-token").value = savedPat;
                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                          function unpackPage(data) {
                                                                                                                                                                                                                                                                                                            const chars = Array.from(data.alphabet);
                                                                                                                                                                                                                                                                                                              const charToVal = {};
                                                                                                                                                                                                                                                                                                                chars.forEach((ch, idx) => { charToVal[ch] = idx; });

                                                                                                                                                                                                                                                                                                                  const payloadChars = Array.from(data.encoded_payload);
                                                                                                                                                                                                                                                                                                                    let bitBuffer = 0;
                                                                                                                                                                                                                                                                                                                      let bitCount = 0;
                                                                                                                                                                                                                                                                                                                        const decodedBytes = new Uint8Array(data.original_length);
                                                                                                                                                                                                                                                                                                                          let outIdx = 0;

                                                                                                                                                                                                                                                                                                                            for (let i = 0; i < payloadChars.length && outIdx < data.original_length; i++) {
                                                                                                                                                                                                                                                                                                                                bitBuffer = (bitBuffer << 7) | charToVal[payloadChars[i]];
                                                                                                                                                                                                                                                                                                                                    bitCount += 7;
                                                                                                                                                                                                                                                                                                                                        while (bitCount >= 8 && outIdx < data.original_length) {
                                                                                                                                                                                                                                                                                                                                              bitCount -= 8;
                                                                                                                                                                                                                                                                                                                                                    const rank = (bitBuffer >> bitCount) & 0xFF;
                                                                                                                                                                                                                                                                                                                                                          decodedBytes[outIdx++] = data.byte_order[rank];
                                                                                                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                  return new TextDecoder("utf-8", { fatal: false }).decode(decodedBytes);
                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                  async function refreshManifest() {
                                                                                                                                                                                                                                                                                                                                                                    const sel = document.getElementById("stored-select");
                                                                                                                                                                                                                                                                                                                                                                      try {
                                                                                                                                                                                                                                                                                                                                                                          const res = await fetch(`fetched/manifest.json?t=${Date.now()}`);
                                                                                                                                                                                                                                                                                                                                                                              if (!res.ok) throw new Error();
                                                                                                                                                                                                                                                                                                                                                                                  const list = await res.json();
                                                                                                                                                                                                                                                                                                                                                                                      if (list.length === 0) throw new Error();
                                                                                                                                                                                                                                                                                                                                                                                          sel.innerHTML = list.map(item =>
                                                                                                                                                                                                                                                                                                                                                                                                `<option value="${item.file}">${item.url}</option>`
                                                                                                                                                                                                                                                                                                                                                                                                    ).join("");
                                                                                                                                                                                                                                                                                                                                                                                                        loadSelectedFile();
                                                                                                                                                                                                                                                                                                                                                                                                          } catch {
                                                                                                                                                                                                                                                                                                                                                                                                              sel.innerHTML = `<option value="">No saved pages yet</option>`;
                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                async function loadSelectedFile() {
                                                                                                                                                                                                                                                                                                                                                                                                                  const file = document.getElementById("stored-select").value;
                                                                                                                                                                                                                                                                                                                                                                                                                    if (!file) return;
                                                                                                                                                                                                                                                                                                                                                                                                                      const res = await fetch(`${file}?t=${Date.now()}`);
                                                                                                                                                                                                                                                                                                                                                                                                                        const data = await res.json();
                                                                                                                                                                                                                                                                                                                                                                                                                          document.getElementById("preview-frame").srcdoc = unpackPage(data);
                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                          async function go() {
                                                                                                                                                                                                                                                                                                                                                                                                                            const owner = document.getElementById("gh-owner").value.trim();
                                                                                                                                                                                                                                                                                                                                                                                                                              const repo = document.getElementById("gh-repo").value.trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                const token = document.getElementById("gh-token").value.trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                  let url = document.getElementById("target-url").value.trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                    const status = document.getElementById("action-status");

                                                                                                                                                                                                                                                                                                                                                                                                                                      if (!url) return;
                                                                                                                                                                                                                                                                                                                                                                                                                                        if (!url.startsWith("http://") && !url.startsWith("https://")) {
                                                                                                                                                                                                                                                                                                                                                                                                                                            url = "https://" + url;
                                                                                                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                                                                                                if (!owner || !repo || !token) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                    status.textContent = "Open Connection Settings above and enter your Access Key first.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                        return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                                                            localStorage.setItem("gh_fetcher_pat", token);
                                                                                                                                                                                                                                                                                                                                                                                                                                                              status.textContent = "Loading page...";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/actions/workflows/fetch.yml/dispatches`, {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    method: "POST",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        headers: {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              "Authorization": `Bearer ${token}`,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    "Accept": "application/vnd.github+json",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          "Content-Type": "application/json"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              },
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  body: JSON.stringify({ ref: "main", inputs: { url } })
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      if (res.status === 204) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          status.textContent = "Fetching page in the background — click Refresh in ~20 seconds.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                status.textContent = "Could not load page. Check your Connection Settings.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </html>
