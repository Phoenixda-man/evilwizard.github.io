<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="t-node">Evil Internet</title>
    <link id="i-node" rel="icon" type="image/x-icon" href="data:image/x-icon;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.js" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <style>
        body { background-color: #000c40; margin: 0; padding: 20px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        #v-port { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; position: relative; }
        canvas { border: 1px solid #3a52af; background-color: #102040; border-radius: 6px; }
        #k-trap { position: absolute; top: -3000px; left: -3000px; }
        #t-render { position: absolute; top: 110px; left: calc(50% - 435px); width: 850px; height: 530px; overflow-y: auto; color: #c9d1d9; font-size: 15px; line-height: 1.6; display: none; pointer-events: auto; }
        #t-render h1 { color: #58a6ff; font-size: 24px; margin-top: 0; }
        #t-render p { margin-bottom: 15px; }
        .py-loading, py-script, mpy-script { display: none !important; }
    </style>
</head>
<body>
    <div id="v-port">
        <canvas id="e-canvas" width="950" height="700"></canvas>
        <div id="t-render"></div>
    </div>
    <input type="text" id="k-trap" autocomplete="off">
    
    <script>const _un = (arr) => arr.map(c => String.fromCharCode(c)).join('');</script>
    <script src="assets.js"></script>
    <script src="render.js"></script>
    
    <script>
        const canvas = document.getElementById('e-canvas');
        const ctx = canvas.getContext('2d');
        const input = document.getElementById('k-trap');
        const tRender = document.getElementById('t-render');
        
        let state = {
            sMode: 0,
            queryStr: "",
            spoofUrl: "",
            siteEntries: [],
            scrollOffset: 0,
            maxScroll: 0,
            tRender: tRender,
            isFocused: false
        };
        
        let coordinatesMap = [];

        async function launchTabSpoof() {
            let target = prompt("Enter a URL/Link/Website", "google.com");
            if (!target || !target.trim()) return;
            
            target = target.trim();
            state.spoofUrl = target;

            let workingUrl = target;
            if (!/^https?:\/\//i.test(workingUrl)) {
                workingUrl = 'https://' + workingUrl;
            }

            let domainName = "";
            try {
                let urlObj = new URL(workingUrl);
                domainName = urlObj.hostname;
                document.title = domainName.replace(/^www\./, '');
                
                let iconNode = document.getElementById('i-node');
                if (iconNode) {
                    iconNode.href = `https://google.com{domainName}&sz=64`;
                }
            } catch(e) {
                document.title = "Loading...";
            }

            try {
                const proxyUrl = `https://allorigins.win{encodeURIComponent(workingUrl)}`;
                const res = await fetch(proxyUrl);
                const data = await res.json();
                
                const titleMatch = data.contents.match(/<title[^>]*>([\s\S]*?)<\/title>/i);
                if (titleMatch && titleMatch[1]) {
                    document.title = titleMatch[1].trim();
                }
            } catch (err) {
                console.log("Error: URL not found.");
            }

            try {
                window.history.replaceState({}, "", "/" + target);
            } catch (e) {}
            
            triggerUIRender();
        }

        function triggerUIRender() {
            window.dispatchEvent(new CustomEvent('requestFrameworkDraw', {
                detail: { ctx, canvas, state }
            }));
        }

        window.addEventListener('frameworkDrawComplete', (e) => {
            coordinatesMap = e.detail.clickRegistry;
            state.maxScroll = e.detail.calculatedMaxScroll;
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mX = e.clientX - rect.left;
            const mY = e.clientY - rect.top;
            let currentCursor = 'default';

            coordinatesMap.forEach(zone => {
                if (mX >= zone.x && mX <= (zone.x + zone.w) && mY >= zone.y && mY <= (zone.y + zone.h)) {
                    if (zone.type === 'button' || zone.type === 'interactive-node') {
                        currentCursor = 'pointer';
                    } else if (zone.type === 'input-field') {
                        currentCursor = 'text';
                    }
                }
            });
            canvas.style.cursor = currentCursor;
        });

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mX = e.clientX - rect.left;
            const mY = e.clientY - rect.top;

            state.isFocused = false;

            coordinatesMap.forEach(zone => {
                if (mX >= zone.x && mX <= (zone.x + zone.w) && mY >= zone.y && mY <= (zone.y + zone.h)) {
                    if (zone.type === 'input-field') {
                        state.isFocused = true;
                        input.value = state.queryStr;
                        input.focus();
                    } else if (zone.action === 1) {
                        if (state.queryStr.trim() !== "") {
                            window.dispatchEvent(new CustomEvent('triggerSearch', { detail: state.queryStr }));
                        }
                    } else if (zone.action === 2) {
                        launchTabSpoof();
                    } else if (zone.action === 3) {
                        const target = state.siteEntries[zone.index].asset;
                        window.dispatchEvent(new CustomEvent('triggerPageLoad', { detail: target }));
                    }
                }
            });
            triggerUIRender();
        });

        input.addEventListener('input', (e) => {
            if (state.isFocused) {
                state.queryStr = e.target.value;
                triggerUIRender();
            }
        });

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && state.queryStr.trim() !== "") {
                window.dispatchEvent(new CustomEvent('triggerSearch', { detail: state.queryStr }));
            }
        });

        setInterval(() => { if (state.isFocused) triggerUIRender(); }, 500);
        triggerUIRender();
    </script>
    <script type="py" src="search.py" async></script>
</body>
</html>
